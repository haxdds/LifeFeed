[project]
name = "backend"
version = "0.1.0"
description = "LifeFeed — a Twitter clone API (FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
redis = [
    "redis>=8.1.0",
]
postgres = [
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
